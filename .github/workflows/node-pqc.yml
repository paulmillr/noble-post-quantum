name: Node PQC Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: node --experimental-strip-types --test test/webcrypto-smoke.test.ts
